{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h2>Create Account</h2>

{% if success %}
    <p>{{ success }}</p>
{% endif %}

{% if errors %}
    <p>{{ errors }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username">

    <br><br>

    <label>Email:</label>
    <input type="email" name="email">

    <br><br>

    <label>Password:</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Register</button>
</form>

{% endblock %}
